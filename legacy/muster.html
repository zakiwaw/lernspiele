<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muster">
<title>Muster</title>
<link rel="stylesheet" href="style.css">
<style>
#seq{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap}
.cell{width:var(--cell);height:var(--cell);flex:none;display:flex;align-items:center;justify-content:center}
.cell .ti{font-size:calc(var(--cell)*0.85)}
.cell .dot{width:80%;height:80%;border-radius:50%}
.qc{border:3px dashed var(--line);border-radius:16px;font-size:calc(var(--cell)*0.5);color:var(--muted)}
.ask{font-size:24px;color:var(--muted);margin:0 0 14px}
#opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:center;flex:none}
.opt{width:var(--tile);height:var(--tile);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px;border:2px solid var(--line);border-radius:22px;background:var(--card);font-size:20px}
.opt:active{transform:scale(.97)}
.opt .ti{font-size:calc(var(--tile)*0.46)}
.opt .dot{width:calc(var(--tile)*0.42);height:calc(var(--tile)*0.42);border-radius:50%}
.cap{font-size:16px;color:var(--muted);margin:0 0 8px}
.set .chips{margin-bottom:22px}
</style>
</head>
<body class="game">
<div class="app">
  <div class="top">
    <button class="gear" id="gear" aria-label="Einstellungen (gedrückt halten)"><i class="ti ti-settings" aria-hidden="true"></i></button>
    <span class="hint" id="hint"></span>
    <span class="score"><i class="ti ti-star" aria-hidden="true"></i><span id="stars">0</span></span>
  </div>

  <div class="main" id="main">
    <div class="stage" id="stage">
      <p class="ask">Was kommt als Nächstes?</p>
      <div id="seq"></div>
    </div>
    <div id="opts"></div>
  </div>

  <div class="bottom"><p class="msg" id="msg"></p></div>
</div>

<div id="settings" class="overlay set" style="display:none">
  <div class="wrap">
    <h2>Einstellungen</h2>
    <p class="cap">Thema</p>
    <div class="chips" id="themes"></div>
    <p class="cap">Stufe</p>
    <div class="chips" id="levels"></div>
    <p style="margin-top:28px"><button class="bigbtn" id="done">Fertig, los geht's</button></p>
    <p style="margin-top:28px"><a class="back" href="index.html">Zurück zum Menü</a></p>
  </div>
</div>

<script src="common.js"></script>
<script>
var THEMES={
 'Farben':[{n:'Rot',dot:1,col:'#E24B4A'},{n:'Grün',dot:1,col:'#639922'},{n:'Gelb',dot:1,col:'#F2C230'},{n:'Blau',dot:1,col:'#378ADD'}],
 'Tiere':[{n:'Katze',ic:'cat',col:'#BA7517'},{n:'Hund',ic:'dog',col:'#7F77DD'},{n:'Fisch',ic:'fish',col:'#378ADD'},{n:'Käfer',ic:'bug',col:'#E24B4A'}],
 'Blumen':[{n:'Rote Blume',ic:'flower',col:'#E24B4A'},{n:'Gelbe Blume',ic:'flower',col:'#EF9F27'},{n:'Rosa Blume',ic:'flower',col:'#D4537E'},{n:'Blatt',ic:'leaf',col:'#639922'}],
 'Fahrzeuge':[{n:'Auto',ic:'car',col:'#E24B4A'},{n:'Bus',ic:'bus',col:'#EF9F27'},{n:'Laster',ic:'truck',col:'#378ADD'},{n:'Zug',ic:'train',col:'#1D9E75'}],
 'Flugzeuge':[{n:'Blaues Flugzeug',ic:'plane',col:'#378ADD'},{n:'Gelbes Flugzeug',ic:'plane',col:'#EF9F27'},{n:'Hubschrauber',ic:'helicopter',col:'#E24B4A'},{n:'Rakete',ic:'rocket',col:'#7F77DD'}]
};
var LEVELS={
 'Leicht':[[0,1],[0,0,1],[0,1,1]],
 'Mittel':[[0,1,2],[0,0,1,2],[0,1,1,2]],
 'Schwer':[[0,1,2,3],[0,1,0,2],[0,0,1,1,2],[0,1,2,2,3]]
};
var theme='Farben',level='Leicht',stars=0,answer=null,locked=false,timer=null;
function $(id){return document.getElementById(id)}
function glyph(it){
  if(it.dot)return '<div class="dot" style="background:'+it.col+'"></div>';
  return '<i class="ti ti-'+it.ic+'" style="color:'+it.col+'" aria-hidden="true"></i>';
}
function buildChips(id,names,cur,setter){
  var box=$(id);box.innerHTML='';
  names.forEach(function(nm){
    var b=document.createElement('button');
    b.className='chip'+(nm===cur?' on':'');b.textContent=nm;
    b.addEventListener('click',function(){setter(nm)});
    box.appendChild(b);
  });
}
function chips(){
  buildChips('themes',Object.keys(THEMES),theme,function(v){theme=v;chips()});
  buildChips('levels',Object.keys(LEVELS),level,function(v){level=v;chips()});
}
function layout(n){
  var main=$('main'),W=main.clientWidth||600,H=main.clientHeight||500,gap=16;
  var land=window.innerWidth>window.innerHeight;
  main.className='main';
  var stageH=Math.floor(H*(land?0.36:0.34)),optH=H-stageH-gap;
  $('stage').style.width=W+'px';
  $('stage').style.height=stageH+'px';
  var cell=Math.floor(Math.min((W-24-(n-1)*8)/n,(stageH-90),120));
  $('seq').style.setProperty('--cell',Math.max(30,cell)+'px');
  var cols=land?4:2,rows=Math.ceil(4/cols);
  var tile=Math.floor(Math.min((W-(cols-1)*gap)/cols,(optH-(rows-1)*gap)/rows,260));
  $('opts').style.width=W+'px';
  $('opts').style.height=optH+'px';
  $('opts').style.setProperty('--tile',Math.max(90,tile)+'px');
  $('stage').style.setProperty('--cell',Math.max(30,cell)+'px');
}
var curN=7;
function newRound(){
  if(timer){clearTimeout(timer);timer=null}
  $('settings').style.display='none';
  var units=LEVELS[level],u=units[Math.floor(Math.random()*units.length)];
  var items=shuffle(THEMES[theme].slice());
  var len=u.length,n=len===2?5:(len===3?7:8);
  curN=n;
  layout(n);
  var seqBox=$('seq');seqBox.innerHTML='';
  for(var i=0;i<n-1;i++){
    var c=document.createElement('div');c.className='cell';
    c.innerHTML=glyph(items[u[i%len]]);
    seqBox.appendChild(c);
  }
  var q=document.createElement('div');q.className='cell qc';q.id='q';q.textContent='?';
  seqBox.appendChild(q);
  answer=items[u[(n-1)%len]];
  var opts=$('opts');opts.innerHTML='';
  shuffle(THEMES[theme].slice()).forEach(function(it){
    var b=document.createElement('button');b.className='opt';
    b.innerHTML=glyph(it)+'<span>'+it.n+'</span>';
    b.addEventListener('click',function(){pick(it)});
    opts.appendChild(b);
  });
  locked=false;
  $('msg').textContent='';
}
function pick(it){
  if(locked)return;
  var q=$('q'),msg=$('msg');
  if(it===answer){
    locked=true;
    q.className='cell pop';q.innerHTML=glyph(answer);
    stars++;$('stars').textContent=stars;
    msg.style.color='var(--ok)';msg.textContent='Super gemacht!';
    winSound();
    timer=setTimeout(newRound,1100);
  }else{
    msg.style.color='var(--bad)';msg.textContent='Nochmal probieren';
    q.classList.remove('shake');void q.offsetWidth;q.classList.add('shake');
  }
}
function openSettings(){
  if(timer){clearTimeout(timer);timer=null}
  chips();
  $('settings').style.display='block';
}
holdButton($('gear'),700,openSettings,function(){showHint('Zahnrad gedrückt halten, dann öffnen sich die Einstellungen')});
$('done').addEventListener('click',newRound);
var rt=null;
function onResize(){clearTimeout(rt);rt=setTimeout(function(){layout(curN)},150)}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
lockScroll();
chips();newRound();
</script>
</body>
</html>
